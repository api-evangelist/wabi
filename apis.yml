aid: wabi
name: Wabi
description: 'Wabi is a consumer AI mini-app platform — billed as "the first personal
  software platform" and a "YouTube of apps" — where anyone can create, discover, share,
  and remix AI-generated mini-apps from a single natural-language prompt while Wabi
  handles the underlying infrastructure, UI, hosting, and data. Founded by Eugenia
  Kuyda (founder of the AI companion app Replika) and backed by a roughly $20M pre-seed
  round (investors include Naval Ravikant, Garry Tan, Justin Kan, and Forerunner Ventures),
  Wabi is an invite/beta consumer product. As of this profile it publishes no public
  developer API, SDKs, OpenAPI, or developer documentation — only the consumer web
  app and its Terms/Privacy pages.'
